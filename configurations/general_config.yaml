paths:
  videos: "videos"
  audios: "audios"
  transcripts: "transcripts"
  logs: "logs"

files:
  params: "configurations/params.yaml"
  prompts: "configurations/prompts.yaml"
  diarization: "configurations/diarization.yaml"

extensions:
  # Which files the CLI picks up from videos/ and audios/ and the GUI offers to
  # upload. A convenience list only: any file ffmpeg can read that has an audio
  # track is accepted, and video vs audio is decided by probing the file.
  video:
    - ".mp4"
    - ".mov"
    - ".avi"
    - ".mkv"
    - ".webm"
    - ".m4v"
    - ".wmv"
    - ".flv"
    - ".ts"
    - ".mpg"
  audio:
    - ".mp3"
    - ".m4a"
    - ".aac"
    - ".wav"
    - ".flac"
    - ".ogg"
    - ".opus"
    - ".wma"
    - ".aiff"

output:
  transcript_extension: ".txt"
  cleaned_suffix: "_clean"
  extracted_audio_extension: ".mp3"

ollama:
  url: "http://localhost:11434/api/generate"
  timeout_seconds: 600
  request_content_type: "application/json"

processing:
  progress_update_interval_seconds: 0.25

dependencies:
  ffmpeg_executable: "ffmpeg"

logging:
  level: "INFO"
  file_name: "transcriber.log"
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
